<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <style>
   
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, #1a1a1a, #2e2e2e);
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }

  .container {
    max-width: 500px;
    width: 100%;
    background: rgba(33, 33, 33, 0.9);
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.9),
                -4px -4px 15px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
  }

  .container h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 26px;
    color: #ffffff;
  }

  input, select {
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    background-color: #212121;
    color: white;
    border: 2px solid #212121;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s ease-in-out;
    box-shadow: 4px 4px 12px rgba(0,0,0,1),
                1px 1px 10px rgba(255,255,255,0.2);
  }

  input::placeholder {
    color: #aaa;
  }

  input:focus, select:focus {
    outline: none;
    transform: scale(1.03);
    box-shadow: 6px 6px 14px rgba(0,0,0,1),
                1px 1px 12px rgba(255,255,255,0.4),
                inset 2px 2px 10px rgba(0,0,0,1),
                inset -1px -1px 5px rgba(255,255,255,0.6);
  }

  button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background-color: #212121;
    color: white;
    font-weight: bold;
    border: 2px solid #212121;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s ease-in-out;
    box-shadow: 6px 6px 10px rgba(0, 0, 0, 1),
                1px 1px 10px rgba(255, 255, 255, 0.2);
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 6px 6px 10px rgba(0,0,0,1),
                1px 1px 10px rgba(255,255,255,0.6),
                inset 2px 2px 10px rgba(0,0,0,1),
                inset -1px -1px 5px rgba(255,255,255,0.6);
  }

  a button {
    background-color: #2c2c2c;
  }

  #message {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    color: #ccc;
  }
</style>

  </style>
</head>
<body>
  <div class="container">
    <h2>User Signup</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Name" required />
      <input type="number" id="age" placeholder="Age" required />
      <input type="email" id="email" placeholder="Email" />
      <input type="text" id="mobile" placeholder="Mobile Number" />
      <input type="text" id="address" placeholder="Address" required />
      <input type="text" id="aadharCardNumber" placeholder="Aadhar Card Number (12 digits)" required />
      <input type="password" id="password" placeholder="Password" required />
      <select id="role" required>
        <option value="voter">Voter</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit">Signup</button>
      <a href="login.html">
        <button type="button">Go to Login</button>
      </a>
      
    </form>
    <p id="message"></p>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const user = {
        name: document.getElementById("name").value,
        age: Number(document.getElementById("age").value),
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        address: document.getElementById("address").value,
        aadharCardNumber: document.getElementById("aadharCardNumber").value,
        password: document.getElementById("password").value,
        role: document.getElementById("role").value
      };

      try {
        const res = await fetch("http://localhost:3000/user/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user)
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById("message").textContent = "Signup successful! Token: " + data.token;
        } else {
          document.getElementById("message").textContent = "Error: " + data.error;
        }
      } catch (err) {
        console.error(err);
        document.getElementById("message").textContent = "Something went wrong.";
      }
    });
  </script>
</body>
</html>
