<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
     body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #1a1a1a, #2e2e2e);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(33, 33, 33, 0.9);
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.9),
                  -4px -4px 15px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 26px;
      color: #ffffff;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      background-color: #212121;
      color: white;
      border: 2px solid #212121;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s ease-in-out;
      box-shadow: 4px 4px 12px rgba(0,0,0,1),
                  1px 1px 10px rgba(255,255,255,0.2);
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      outline: none;
      transform: scale(1.03);
      box-shadow: 6px 6px 14px rgba(0,0,0,1),
                  1px 1px 12px rgba(255,255,255,0.4),
                  inset 2px 2px 10px rgba(0,0,0,1),
                  inset -1px -1px 5px rgba(255,255,255,0.6);
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background-color: #212121;
      color: white;
      font-weight: bold;
      border: 2px solid #212121;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      box-shadow: 6px 6px 10px rgba(0, 0, 0, 1),
                  1px 1px 10px rgba(255, 255, 255, 0.2);
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 6px 6px 10px rgba(0,0,0,1),
                  1px 1px 10px rgba(255,255,255,0.6),
                  inset 2px 2px 10px rgba(0,0,0,1),
                  inset -1px -1px 5px rgba(255,255,255,0.6);
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Login</h2>
    <form id="loginForm">
      <input type="text" id="aadharCardNumber" placeholder="Aadhar Card Number" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const loginData = {
        aadharCardNumber: document.getElementById("aadharCardNumber").value,
        password: document.getElementById("password").value
      };

      try {
        const res = await fetch("http://localhost:3000/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(loginData)
        });

        const data = await res.json();
        if (res.ok) {
            localStorage.setItem("token", data.token);
            alert('Login successful!');
            window.location.href = 'viewcandidates.html';
          document.getElementById("message").textContent = `${data.role} Login Successful. Token: ${data.token}`;
          // Optionally store token:
          localStorage.setItem("token", data.token);
        } else {
          document.getElementById("message").textContent = "Error: " + data.error;
        }
      } catch (err) {
        console.error(err);
        document.getElementById("message").textContent = "Something went wrong.";
      }
    });
  </script>
</body>
</html>
