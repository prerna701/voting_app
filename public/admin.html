<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <style>
     body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('library.jpg'); /* Path to your image */
      background-size: cover; /* Make sure the image covers the entire screen */
      background-position: center; /* Center the image */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-repeat: no-repeat; /* Ensure the image doesn't repeat */
    }

    h2 {
      color: white;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px #00000066;
    }

    form {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 300px;
      margin-bottom: 30px;
      animation: fadeIn 0.8s ease-in-out;
    }

    input {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      background: #f7f7f7;
      outline: none;
    }

    button {
      padding: 12px;
      background-color: #27ae60;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1e8449;
    }

    #addCandidateSection {
      margin-top: 30px;
    }

    .hidden {
      display: none;
    }

    .visible {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
     </style>
</head>
<body>

  <h2>Admin Login</h2>
  <form id="loginForm">
    <input type="text" id="aadharCardNumber" placeholder="Aadhar Number" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <div id="addCandidateSection" class="hidden">
    <h2>Add Candidate</h2>
    <form id="candidateForm">
      <input type="text" id="name" placeholder="Candidate Name" required />
      <input type="text" id="party" placeholder="Party" required />
      <input type="number" id="age" placeholder="Age" required />
      <button type="submit">Add Candidate</button>
      <button><a href="viewcandidates.html">view candidates</a></button>
     
    </form>
  </div>

  <script> 
    let token = "";

    // Login handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const aadharCardNumber = document.getElementById("aadharCardNumber").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:3000/user/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ aadharCardNumber, password })
        });

        const data = await res.json();

        if (res.ok) {
          token = data.token;
          alert("Login successful!");
          document.getElementById("loginForm").classList.add("hidden");
          document.getElementById("addCandidateSection").classList.remove("hidden");
        } else {
          alert(data.error || "Login failed");
        }
      } catch (err) {
        console.error(err);
        alert("Something went wrong");
      }
    });

    // Add candidate handler
    document.getElementById("candidateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const party = document.getElementById("party").value;
      const age = document.getElementById("age").value;

      try {
        const res = await fetch("http://localhost:3000/candidate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ name, party, age })
        });

        const data = await res.json();

        if (res.ok) {
          alert("Candidate added successfully!");
          document.getElementById("candidateForm").reset();
   
        } else {
          alert(data.error || "Error adding candidate");
        }
      } catch (err) {
        console.error(err);
        alert("Something went wrong");
      }
    });
  </script>
</body>
</html>
